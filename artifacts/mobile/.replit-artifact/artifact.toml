kind = "mobile"
previewPath = "/mobile/"
title = "EngiNexus Mobile"
description = "A mobile companion app for the EngiNexus engineering projects showcase. Lets students browse trending and recent projects, filter by course, search by component, upvote their favorites, and read comments — all from their phone. Uses the same JWT API as the web app."
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile", "run", "serve" ]

[services.env]
PORT = "18115"
BASE_PATH = "/mobile/"
