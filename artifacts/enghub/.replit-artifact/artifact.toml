kind = "web"
    previewPath = "/"
    title = "EngHub"
    description = "A full-stack engineering projects showcase platform where students and engineers can share academic and personal projects, browse submissions by course/difficulty, upvote favorites, and leave comments. Built for academic communities to discover and celebrate engineering work."
    version = "1.0.0"
    id = "artifacts/enghub"
    router = "path"

    [[services]]
    name = "web"
    paths = [ "/" ]
    localPort = 23429

    [services.development]
    run = "pnpm --filter @workspace/enghub run dev"

    [services.production]
    build = [ "pnpm", "--filter", "@workspace/enghub", "run", "build" ]
    serve = "static"
    publicDir = "client/dist/public"

    [[services.production.rewrites]]
    from = "/*"
    to = "/index.html"

    [services.env]
    PORT = "23429"
    BASE_PATH = "/"
    